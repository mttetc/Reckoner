name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in sync with backend/scripts/install_pob.sh (POB_COMMIT). Bumping it changes every
  # recalculated metric's provenance, so it is a deliberate, reviewed change.
  POB_COMMIT: ed354c2f8c42e148bc904c7508dbe851fb2cf952

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/ruff check app tests scripts && .venv/bin/ruff format --check app tests scripts
      - name: Tests without the engine (recalculation must degrade to 503, never approximate)
        run: .venv/bin/python -m pytest -q
      - name: SPEC § 15 — first light on a real export
        run: .venv/bin/python scripts/first_light.py tests/fixtures/pob/slayer_lightning_strike_3_27.txt

  engine:
    # SPEC § 5 B — the real headless Path of Building, pinned. Numbers asserted here come from PoB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: cd backend && python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Cache Path of Building checkout
        uses: actions/cache@v5
        with:
          path: .engines/pob
          key: pob-${{ env.POB_COMMIT }}-v1
      - name: Install Path of Building (pinned)
        run: backend/scripts/install_pob.sh
      - name: Engine tests (must not skip)
        run: cd backend && .venv/bin/python -m pytest -q tests/engine tests/integration -rs
        env:
          RECKONER_POB_SRC: ${{ github.workspace }}/.engines/pob/src
          RECKONER_POB_SOURCE_COMMIT: ${{ env.POB_COMMIT }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, engine]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: cd backend && python -m venv .venv && .venv/bin/pip install -e .
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Cache Path of Building checkout
        uses: actions/cache@v5
        with:
          path: .engines/pob
          key: pob-${{ env.POB_COMMIT }}-v1
      - name: Install Path of Building (pinned)
        run: backend/scripts/install_pob.sh
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm exec playwright install --with-deps chromium
      - run: cd frontend && pnpm test:e2e
        env:
          CI: "1"
          RECKONER_POB_SRC: ${{ github.workspace }}/.engines/pob/src
          RECKONER_POB_SOURCE_COMMIT: ${{ env.POB_COMMIT }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: frontend/test-results, retention-days: 7 }
