[project]
name = "reckoner-backend"
version = "0.1.0"
description = "Reckoner — backend (FastAPI). Deterministic, provenance-first build analysis across ARPGs."
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "lxml>=5.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
rag = ["fastembed>=0.7"]  # local ONNX embeddings; without it retrieval falls back to HashEmbedder
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
